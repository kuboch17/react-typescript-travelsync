<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740" role="img" aria-labelledby="title desc">
  <title id="title">How TripSync Firebase login and authorization work</title>
  <desc id="desc">Firebase Auth verifies email and password and supplies a UID and ID token. Firestore Rules check membership, vote ownership and trip ownership. A signed-in user joins through an exact code lookup and atomic self-membership write without reading the private trip first.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#58706b"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #193c35; }
      .title { font-size: 30px; font-weight: 700; }
      .sub { font-size: 16px; fill: #627772; }
      .label { font-size: 19px; font-weight: 700; }
      .body { font-size: 16px; }
      .step { font-size: 14px; font-weight: 700; fill: #347f6a; letter-spacing: 1px; }
      .line { stroke: #58706b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .box { fill: #fff; stroke: #d8e5df; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1100" height="740" rx="20" fill="#f4f8f5"/>
  <text x="40" y="54" class="title">Firebase in TripSync</text>
  <text x="40" y="83" class="sub">Authentication answers “Who are you?” · Authorization answers “What can you do?”</text>
  <text x="40" y="124" class="step">01 / SIGN IN</text>
  <rect x="40" y="145" width="250" height="140" rx="14" class="box"/>
  <text x="60" y="178" class="label">TripSync login</text>
  <text x="60" y="207" class="body">Email + password</text>
  <text x="60" y="235" class="body">Register or sign in</text>
  <text x="60" y="262" class="sub">No demo identity selector</text>
  <path d="M 300 215 H 347" class="line"/>
  <rect x="360" y="145" width="310" height="140" rx="14" class="box"/>
  <text x="380" y="178" class="label">Firebase Authentication</text>
  <text x="380" y="207" class="body">Verifies the account</text>
  <text x="380" y="235" class="body">Supplies UID + signed ID token</text>
  <text x="380" y="262" class="sub">SDK attaches identity to requests</text>
  <path d="M 680 215 H 727" class="line"/>
  <rect x="740" y="145" width="320" height="140" rx="14" fill="#e7f3eb" stroke="#b5d7c2"/>
  <text x="760" y="178" class="label">Firestore Security Rules</text>
  <text x="760" y="207" class="body">Read caller's Firebase UID</text>
  <text x="760" y="235" class="body">Check access for every request</text>
  <text x="760" y="262" class="sub">Login alone does not grant access</text>
  <text x="40" y="332" class="step">02 / JOIN A PRIVATE TRIP</text>
  <rect x="40" y="352" width="250" height="130" rx="14" class="box"/>
  <text x="60" y="386" class="label">Enter the shared code</text>
  <text x="60" y="415" class="body">Signed-in user only</text>
  <text x="60" y="444" class="sub">Random 128-bit trip code</text>
  <path d="M 300 417 H 347" class="line"/>
  <rect x="360" y="352" width="310" height="130" rx="14" class="box"/>
  <text x="380" y="386" class="label">Exact code lookup</text>
  <text x="380" y="415" class="body">tripCodes/{code} → tripId</text>
  <text x="380" y="444" class="sub">No code list; no trip read yet</text>
  <path d="M 680 417 H 727" class="line"/>
  <rect x="740" y="352" width="320" height="130" rx="14" fill="#e7f3eb" stroke="#b5d7c2"/>
  <text x="760" y="386" class="label">Atomic membership write</text>
  <text x="760" y="415" class="body">Code proof + add own UID</text>
  <text x="760" y="444" class="sub">Rules verify code and final state</text>
  <text x="40" y="529" class="step">03 / COLLABORATE WITH RULES</text>
  <rect x="40" y="548" width="1020" height="144" rx="14" class="box"/>
  <path d="M 378 565 V 675 M 715 565 V 675" stroke="#d8e5df"/>
  <text x="62" y="582" class="label">Trip members</text>
  <text x="62" y="612" class="body">Read trip, activities and votes</text>
  <text x="62" y="640" class="body">Edit ideas and the itinerary</text>
  <text x="62" y="668" class="sub">Changes stream in realtime</text>
  <text x="400" y="582" class="label">Own vote only</text>
  <text x="400" y="612" class="body">votes/{Firebase UID}</text>
  <text x="400" y="640" class="body">Create or delete your own vote</text>
  <text x="400" y="668" class="sub">One vote per user per activity</text>
  <text x="737" y="582" class="label">Trip owner only</text>
  <text x="737" y="612" class="body">Delete the trip and its code</text>
  <text x="737" y="640" class="body">Nonmembers cannot read trips</text>
  <text x="737" y="668" class="sub">Old child data stays inaccessible</text>
</svg>
